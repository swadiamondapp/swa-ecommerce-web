name: Deploy Next.js App

on:
  push:
    branches: [CI/CD-DEPLOY]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    # Optional: Run tests
    # - name: Run tests
    #   run: npm test

    - name: Upload exported files to server
        uses: appleboy/scp-action@master
        with:
          host: 138.68.84.10
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_LIVE_SWA }}
          source: "out/*"
          target: "/opt/projects/nextjs-auto-deploy-projects/swadiamonds_live_project/out"

      - name: SSH and run deploy.sh for app2
        uses: appleboy/ssh-action@master
        with:
          host: 138.68.84.10
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_LIVE_SWA }}
          script: |
            chmod +x /opt/projects/auto_deploy/deploy.sh 
            /opt/projects/auto_deploy/deploy.sh app-swadiamonds

