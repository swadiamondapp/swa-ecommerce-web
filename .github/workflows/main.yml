name: Deploy Next.js App to Apache

on:
  push:
    branches:
      - swadiamonds.com-new-nextjs-ui-test   # Deploy only from this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Step 3: Ensure correct npm version
      - name: Install correct NPM
        run: npm install -g npm@10

      # Step 4: Install dependencies
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Step 5: Build Next.js App (SSR mode)
      - name: Build App
        run: npm run build

      # Step 6: Zip build output (for SSR)
      - name: Zip build output
        run: |
          if [ -d .next ]; then
            zip -r build.zip .next package.json next.config.js public
          else
            echo "❌ .next folder not found. Build failed."
            exit 1
          fi

      # Step 7: Set up SSH
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_TEST }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 139.59.12.171 >> ~/.ssh/known_hosts

      # Step 8: Upload build.zip to server
      - name: Upload Build
        run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa build.zip root@139.59.12.171:/tmp/build.zip

      # Step 9: Deploy on server using deploy.sh
      - name: Deploy to Server
        run: ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@139.59.12.171 "bash /opt/projects/auto_deploy/deploy.sh app1"
