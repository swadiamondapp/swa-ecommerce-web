name: Deploy Next.js Static App to Apache

on:
  push:
    branches:
      - CI/CD-DEPLOY

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Correct NPM
      run: npm install -g npm@10

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Next.js
      run: |
        npm run build
        npm run export

    - name: Verify Export Folder
      run: |
        if [ ! -d out ]; then
          echo "❌ Export failed: out/ folder missing!"
          exit 1
        fi
        echo "✔ out/ directory found"

    - name: Zip Static Build
      run: |
        cd out
        zip -r ../build.zip .
        cd ..

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY_LIVE_SWA }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 138.68.84.10 >> ~/.ssh/known_hosts

    - name: Upload Build
      run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa build.zip root@138.68.84.10:/tmp/build.zip

    - name: Deploy to Server
      run: ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@138.68.84.10 "bash /opt/projects/auto_deploy/deploy.sh app-swadiamonds"
