name: Deploy Next.js App to Apache

on:
  push:
    branches:
      - CI/CD-DEPLOY   # change branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # STEP 1: Checkout repo
    - name: Checkout Code
      uses: actions/checkout@v4

    # STEP 2: Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # STEP 3: Force Correct NPM
    - name: Install Correct NPM
      run: npm install -g npm@10

    # STEP 4: Install Dependencies
    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    # STEP 5: Build & Export Next.js
    - name: Build & Export App
      run: |
        npm run build
        npx next export

    # STEP 6: Zip build output (out folder)
    - name: Zip build folder
      run: |
        if [ -d out ]; then
          zip -r build.zip out
        else
          echo "❌ out folder not found. Build failed."
          exit 1
        fi

    # STEP 7: Setup SSH
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY_LIVE_SWA }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 138.68.84.10 >> ~/.ssh/known_hosts

    # STEP 8: Upload build.zip
    - name: Upload Build
      run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa build.zip root@138.68.84.10:/tmp/build.zip

    # STEP 9: Run server script to deploy
    - name: Deploy to Server
      run: ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@138.68.84.10 "bash /opt/projects/auto_deploy/deploy.sh app-swadiamonds"





